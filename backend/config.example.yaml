# 全局配置文件

# 配置版本
config_version: 3

# 系统配置
system:
  app_name: harness      # 应用名称
  env: dev               # 运行环境：dev / test / prod
  debug: true            # 是否开启调试模式
  host: 127.0.0.1        # 服务监听地址
  port: 8000             # 服务监听端口，范围 1-65535
  api_prefix: /api       # 接口统一前缀
  allow_origins: ["http://localhost:5173", "http://127.0.0.1:5173"]  # 允许的请求来源
  allow_credentials: true  # 是否允许携带身份凭证
  allow_methods: ["*"]   # 允许的请求方法
  allow_headers: ["*"]   # 允许的请求头
  log_level: INFO        # 日志级别：DEBUG / INFO / WARNING / ERROR / CRITICAL
  log_dir: logs          # 日志目录，相对路径按 backend 解析
  log_max_bytes: 10485760   # 单个日志文件上限（字节），0 表示不滚动
  log_backup_count: 7    # 滚动保留的历史文件数，0 表示只留当前文件
  log_console: null      # 是否输出到控制台，null 表示按 env 自动（prod 关闭）
  db_path: data/harness.db   # 数据库文件路径，历史与检查点共用，相对路径按后端项目根解析
  db_busy_timeout_ms: 5000   # 写冲突时的锁等待上限（毫秒），0 表示不等待
  workspace_dir: data/workspaces   # 会话工作空间根目录，相对路径按后端项目根解析
  upload_max_bytes: 20971520   # 单个上传文件的最大字节数

# 沙箱配置
sandbox:
  use: harness.sandbox.local.local_sandbox_provider:LocalSandboxProvider # 沙箱提供者类路径，格式为 module:Class

# 记忆配置
memory:
  enabled: true          # 是否启用短期记忆
  type: sqlite           # 检查点存储类型
  durability: async      # 写盘时机：sync 每步同步 / async 每步异步 / exit 仅图退出时

# 上下文压缩配置
summarization:                            # 上下文压缩配置
  enabled: true                           # 是否启用上下文压缩
  model_name: deepseek-flash              # 摘要模型名称；null 表示使用本轮对话模型
  trigger:                                # 压缩触发条件，满足任意一项即触发
    - type: tokens                        # 计量方式：tokens 令牌数 / messages 消息条数 / fraction 本轮对话模型上下文比例
      value: 70000                        # tokens/messages 使用大于 0 的整数；fraction 使用大于 0 且小于 1 的小数
  keep:                                   # 压缩后原样保留的最近消息范围
    type: messages                        # 计量方式：tokens 令牌数 / messages 消息条数 / fraction 本轮对话模型上下文比例
    value: 4                              # tokens/messages 使用大于 0 的整数；fraction 使用大于 0 且小于 1 的小数
  trim_tokens_to_summarize: 60000         # 单次传给摘要模型的历史令牌数上限；null 表示不限制

# 会话推荐配置
recommendations:                          # 会话推荐配置
  enabled: true                          # 是否启用会话追问推荐
  model_name: deepseek-flash              # 推荐模型名称；null 表示使用本轮对话模型
  count: 3                                # 每轮推荐的问题数量，1 到 3 条
  max_question_length: 10                # 每条推荐问题的最大字符数
  recent_turns: 0                         # 参考的上一轮已完成对话数量；0 表示只看本轮
  max_input_tokens: 4000                  # 传给推荐模型的输入估算 Token 上限
  timeout_seconds: 8                      # 推荐模型调用超时时间（秒）

# 模型配置，第一个为默认模型
models:
  - model_name: deepseek-flash # 实际模型名称
    display_name: DeepSeek-V4.1-Flash # 显示名称
    description: DeepSeek 快速模型，支持推理与视觉 # 模型描述
    provider: deepseek # 模型厂商
    use: harness.models.deepseek_provider:DeepSeekChatModel # 模型实现
    base_url: https://api.deepseek.com # 服务地址
    api_key: $DEEPSEEK_API_KEY # 服务密钥
    timeout: 60.0 # 请求超时时间
    max_retries: 2 # 最大重试次数
    max_tokens: 393216 # 最大输出令牌数
    supports_thinking: true # 是否支持推理
    reasoning_levels: [low, high, max] # 模型支持的推理强度
    when_thinking_enabled: {extra_body: {thinking: {type: enabled}}} # 启用推理参数
    when_thinking_disabled: {extra_body: {thinking: {type: disabled}}} # 关闭推理参数
    supports_vision: true # 是否支持视觉
    context_window: 1048576 # 模型上下文长度

  - model_name: deepseek-v4-pro # 实际模型名称
    display_name: DeepSeek-V4-Pro # 显示名称
    description: DeepSeek 强推理模型，支持推理，不支持视觉 # 模型描述
    provider: deepseek # 模型厂商
    use: harness.models.deepseek_provider:DeepSeekChatModel # 模型实现
    base_url: https://api.deepseek.com # 服务地址
    api_key: $DEEPSEEK_API_KEY # 服务密钥
    timeout: 60.0 # 请求超时时间
    max_retries: 2 # 最大重试次数
    max_tokens: 393216 # 最大输出令牌数
    supports_thinking: true # 是否支持推理
    reasoning_levels: [low, high, max] # 模型支持的推理强度
    when_thinking_enabled: {extra_body: {thinking: {type: enabled}}} # 启用推理参数
    when_thinking_disabled: {extra_body: {thinking: {type: disabled}}} # 关闭推理参数
    supports_vision: false # 是否支持视觉
    context_window: 1048576 # 模型上下文长度

  - model_name: qwen3.8-max # 实际模型名称
    display_name: Qwen3.8-Max # 显示名称
    description: 千问旗舰模型，支持推理与视觉 # 模型描述
    provider: alibaba # 模型厂商
    use: harness.models.qwen_provider:QwenChatModel # 模型实现
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1 # 服务地址
    api_key: $DASHSCOPE_API_KEY # 服务密钥
    timeout: 60.0 # 请求超时时间
    max_retries: 2 # 最大重试次数
    max_tokens: 131072 # 最大输出令牌数
    supports_thinking: true # 是否支持推理
    reasoning_levels: [low, high, max] # 模型支持的推理强度
    when_thinking_enabled: {enable_thinking: true} # 启用推理参数
    when_thinking_disabled: {enable_thinking: false} # 关闭推理参数
    supports_vision: true # 是否支持视觉
    context_window: 1048576 # 模型上下文长度

  - model_name: qwen3.8-flash # 实际模型名称
    display_name: Qwen3.8-Flash # 显示名称
    description: 千问轻量模型，支持推理与视觉 # 模型描述
    provider: alibaba # 模型厂商
    use: harness.models.qwen_provider:QwenChatModel # 模型实现
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1 # 服务地址
    api_key: $DASHSCOPE_API_KEY # 服务密钥
    timeout: 60.0 # 请求超时时间
    max_retries: 2 # 最大重试次数
    max_tokens: 131072 # 最大输出令牌数
    supports_thinking: true # 是否支持推理
    reasoning_levels: [low, high, max] # 模型支持的推理强度
    when_thinking_enabled: {enable_thinking: true} # 启用推理参数
    when_thinking_disabled: {enable_thinking: false} # 关闭推理参数
    supports_vision: true # 是否支持视觉
    context_window: 1048576 # 模型上下文长度

# 工具分组，仅用于分类和筛选
tool_groups:
  - name: system
  - name: text
  - name: document
  - name: image
  - name: network

# 工具列表
tools:
  # 系统工具
  - name: current_time # 工具名称
    group: system # 所属工具组
    use: harness.tools.system.system_info:current_time # 工具实现
    enabled: true # 是否启用
    aliases: [当前时间, 今天日期] # 查找别名
    settings: {
      default_timezones: [Asia/Shanghai] # 默认时区列表
    } # 工具额外配置

  - name: read_file # 工具名称
    group: system # 所属工具组
    use: harness.tools.system.file_operations:read_file # 工具实现
    enabled: true # 是否启用
    aliases: [读取文件, 查看文件] # 查找别名
    settings: {
      default_max_lines: 2000 # 单次返回的最大行数
    } # 工具额外配置

  - name: list_dir # 工具名称
    group: system # 所属工具组
    use: harness.tools.system.file_operations:list_dir # 工具实现
    enabled: true # 是否启用
    aliases: [列目录, 浏览文件] # 查找别名
    settings: {
      default_max_entries: 200 # 最大返回条目数
    } # 工具额外配置

  - name: create_file # 工具名称
    group: system # 所属工具组
    use: harness.tools.system.file_operations:create_file # 工具实现
    enabled: true # 是否启用
    aliases: [创建文件, 新建文件] # 查找别名

  - name: edit_file # 工具名称
    group: system # 所属工具组
    use: harness.tools.system.file_operations:edit_file # 工具实现
    enabled: true # 是否启用
    aliases: [编辑文件, 替换文本] # 查找别名
    settings: {
      default_max_bytes: 2000000 # 局部替换允许的最大文件字节数
    } # 工具额外配置

  - name: delete_file # 工具名称
    group: system # 所属工具组
    use: harness.tools.system.file_operations:delete_file # 工具实现
    enabled: true # 是否启用
    aliases: [删除文件, 移除文件] # 查找别名

  - name: tool_search # 工具名称
    group: system # 所属工具组
    use: harness.tools.system.tool_search:tool_search # 工具实现
    enabled: true # 是否启用
    aliases: [查找工具, 搜索工具] # 查找别名
    settings: {
      default_max_results: 5 # 本工具最多返回命中条数
    } # 工具额外配置

  - name: describe_skill # 工具名称
    group: system # 所属工具组
    use: harness.skills.describe:describe_skill # 工具实现
    enabled: true # 是否启用
    aliases: [查找技能, 搜索技能] # 查找别名
    settings: {
      default_max_results: 5 # 关键词搜索最多返回的技能数
    } # 工具额外配置

  - name: task # 工具名称
    group: system # 所属工具组
    use: harness.subagents.task_tool:task # 工具实现
    enabled: true # 是否启用
    aliases: [委派子代理, 分派任务] # 查找别名

  # 文本工具
  - name: word_count # 工具名称
    group: text # 所属工具组
    use: harness.tools.text.word_count:word_count # 工具实现
    enabled: true # 是否启用
    aliases: [字数统计, 统计字数] # 查找别名

  # 文档工具
  - name: convert_document_to_markdown # 工具名称
    group: document # 所属工具组
    use: harness.tools.document.convert_document:convert_document_to_markdown # 工具实现
    enabled: true # 是否启用
    aliases: [文档转 Markdown, 转换 Word, 转换 PDF] # 查找别名

  # 图片工具
  - name: view_image # 工具名称
    group: image # 所属工具组
    use: harness.tools.image.view_image:view_image # 工具实现
    enabled: true # 是否启用
    aliases: [查看图片, 读取图片, 分析图片] # 查找别名

  # 网络工具
  - name: web_search # 工具名称
    group: network # 所属工具组
    use: harness.tools.network.web_search:web_search # 工具实现
    enabled: true # 是否启用
    aliases: [网页搜索, 搜索网页, 联网搜索] # 查找别名
    settings: {
      base_url: $WEB_SEARCH_BASE_URL, # 搜索服务地址
      api_key: $WEB_SEARCH_API_KEY, # 搜索服务密钥
      timeout_seconds: 20, # 请求超时秒数
      top_k: 10 # 最多返回网页数
    } # 工具额外配置

  - name: fetch_url # 工具名称
    group: network # 所属工具组
    use: harness.tools.network.fetch_url:fetch_url # 工具实现
    enabled: true # 是否启用
    aliases: [读取网页, 获取网页内容, 打开网页] # 查找别名
    settings: {
      timeout_seconds: 20, # 请求超时秒数
      max_response_bytes: 2000000, # 最大响应字节数
      max_content_chars: 20000, # 最多返回正文字符数
      max_redirects: 3 # 最多重定向次数
    } # 工具额外配置

  - name: download_file # 工具名称
    group: network # 所属工具组
    use: harness.tools.network.download_file:download_file # 工具实现
    enabled: true # 是否启用
    aliases: [下载文件, 保存网络文件, 下载链接] # 查找别名
    settings: {
      timeout_seconds: 30, # 请求超时秒数
      max_download_bytes: 50000000, # 最大下载字节数
      max_redirects: 3 # 最多重定向次数
    } # 工具额外配置

  - name: install_skill # 工具名称
    group: network # 所属工具组
    use: harness.tools.network.install_skill:install_skill # 工具实现
    enabled: true # 是否启用
    aliases: [安装技能, 安装第三方技能, 下载技能] # 查找别名
    settings: {
      timeout_seconds: 30, # 请求超时秒数
      max_redirects: 3 # 最多重定向次数
    } # 工具额外配置

# 技能配置
skills:
  enabled: true          # 是否启用技能
  dir: skills            # 技能根目录，相对路径按 backend 解析
  file: SKILL.md         # 技能主文件名
  categories: [custom, public] # 技能分类目录，靠前的优先
  name_pattern: '^[a-z0-9][a-z0-9-]*$' # 技能名字符集
  description_limit: 1024 # 描述字数上限
  max_download_bytes: 104857600 # 技能压缩包文件字节上限
  max_archive_entries: 10000 # 技能压缩包条目数量上限
  max_unpacked_bytes: 524288000 # 技能压缩包解压字节上限
  max_skill_file_bytes: 1048576 # 技能主文件字节上限

# 子代理配置
subagents:
  enabled: true          # 是否启用子代理
  defaults:              # 子代理共用默认值
    model: inherit       # 使用的模型，inherit 跟随主代理，不填用默认模型
    max_turns: 20        # 模型调用次数上限
    timeout_seconds: 180 # 单次委派超时时间（秒）
    tools: inherit       # 可用工具名单，[] 表示一个都不给
    disallowed_tools: [task] # 禁用工具名单
  items:                 # 子代理列表
    - name: general-purpose # 子代理名称
      use: harness.subagents.builtins.general_purpose:GENERAL_PURPOSE # 子代理定义实现
      model: inherit # 本条使用的模型
      max_turns: 30 # 模型调用次数上限
      tools: [read_file, list_dir, word_count, current_time] # 本条可用工具名单
      disallowed_tools: [tool_search] # 本条禁用工具名单

# MCP 配置
mcp:                               # MCP 配置
  servers:                         # MCP 服务器列表，以名称为键
    aliyun-amap-maps:              # 阿里云百炼高德地图 MCP
      description: 地图和路线工具         # 服务器用途说明
      enabled: false               # 是否启用服务器
      transport: streamable_http   # 连接方式：streamable_http 或 stdio
      url: https://dashscope.aliyuncs.com/api/v1/mcps/amap-maps/mcp # streamable_http 服务器地址
      headers:                     # streamable_http 请求头，密钥可引用环境变量
        Authorization: Bearer ${DASHSCOPE_API_KEY} # 百炼 API Key，不含 Bearer 前缀
      connect_timeout_seconds: 10  # 连接超时时间（秒）
      call_timeout_seconds: 60     # 工具调用超时时间（秒）
    example-stdio:                 # 本地服务器示例
      description: 本地服务示例          # 服务器用途说明
      enabled: false               # 是否启用服务器
      transport: stdio             # 连接方式：streamable_http 或 stdio
      command: uvx                 # 本地服务器启动命令
      args: [example-mcp-server]   # 本地服务器启动参数
      env: {}                      # 本地服务器环境变量
      cwd: null                    # 本地服务器工作目录
      connect_timeout_seconds: 10  # 连接超时时间（秒）
      call_timeout_seconds: 60     # 工具调用超时时间（秒）

# 双容器编排文件
name: harness

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: harness-backend:latest
    restart: unless-stopped
    ports:
      - "9000:8000"
    volumes:
      - backend_data:/app/data
      - backend_logs:/app/logs
      # 配置整目录挂载，单文件挂载会让原子替换失败
      - ./backend/config:/app/config
      - backend_skills:/app/skills/public

  frontend:
    image: nginx:stable-alpine
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "90:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  backend_data:
  backend_logs:
  backend_skills:

# 双容器编排文件
name: harness

services:
  backend:
    build:
      context: ./backend
      # Dockerfile 在产物根目录，路径按构建上下文解析
      dockerfile: ../Dockerfile
    image: harness-backend:latest
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      # 配置整目录挂载，单文件挂载会让原子替换失败
      - ./backend/config:/app/config
      - ./skills:/app/skills/public

  frontend:
    image: nginx:stable-alpine
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  backend_data:
  backend_logs:
  backend_skills:
